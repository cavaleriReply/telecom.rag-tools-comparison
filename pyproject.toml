[project]
name = "telecom-rag-tools-comparison"
version = "0.1.0"
description = "Confronto oggettivo di strumenti RAG/knowledge-retrieval sulla documentazione museale Olivetti"
authors = [
    {name = "Francesco",email = "f.cavaleri@reply.it"}
]
readme = "README.md"
# <3.15: vincolo di cognee (e di altri pacchetti dell'ecosistema).
requires-python = ">=3.12,<3.15"
dependencies = [
    # OCR / accesso ai modelli: un solo client (litellm) per LLM ed embedding,
    # così tutti i framework usano gli stessi modelli via le stesse variabili .env.
    "litellm (>=1.51.0)",
    "google-cloud-aiplatform (>=1.60.0)",  # backend Vertex AI usato da litellm
    "python-dotenv (>=1.0.0)",             # carica .env negli entry-point
    "lightrag-hku (==1.5.7)",
    "supermemory (>=3.61.0,<4.0.0)",
    "cognee (==1.5.4)",
    # R2R: niente SDK ufficiale ("r2r" da PyPI trascina fastapi<0.116, in
    # conflitto con cognee che vuole fastapi>=0.116.2 — impossibile risolvere
    # insieme). L'adapter parla REST diretto (v3) con httpx, già presente
    # transitivamente via litellm ma reso esplicito perché lo importiamo noi.
    # Il server R2R gira a parte, in un venv isolato (scripts/r2r_local.sh),
    # non in questo poetry env. Vedi docs/r2r.md.
    "httpx (>=0.28.0)",
]

[tool.poetry]
# Questo repo e' un banco di prova / benchmark, non una libreria da pubblicare:
# niente packaging, si esegue con `poetry run python -m preprocessing ...`.
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
